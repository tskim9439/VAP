<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>VAPASR live</title>
<style>
 body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:900px;margin:24px auto;padding:0 16px;color:#222}
 h1{font-size:18px;margin:0 0 8px} .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0}
 button{padding:8px 16px;font-size:15px;border-radius:6px;border:1px solid #888;background:#f5f5f5;cursor:pointer} button.on{background:#d33;color:#fff;border-color:#a00}
 select,input{font-size:14px;padding:4px} #text{min-height:160px;border:1px solid #ccc;border-radius:8px;padding:14px;font-size:22px;line-height:1.5;white-space:pre-wrap;background:#fff}
 #text .new{background:#fff3b0} #stats{font:13px/1.5 ui-monospace,Menlo,monospace;color:#555;white-space:pre} #log{font:12px ui-monospace,Menlo,monospace;color:#777;max-height:160px;overflow:auto;white-space:pre}
 .pill{font-size:12px;padding:2px 8px;border-radius:10px;background:#eee}
</style></head><body>
<h1>VAPASR 실시간 음성인식 <span class="pill">__MODEL__</span></h1>
<div class="row">
 <label>언어 <select id="lang"><option value="Korean">Korean</option><option value="English">English</option></select></label>
 <label>δ(지연) <select id="delay"><option>2</option><option>3</option><option>4</option><option>6</option></select></label>
 <label>next_bias <input id="bias" type="number" step="0.5" value="0" style="width:60px"></label>
 <label>입력 장치 <select id="mic"><option value="">기본</option></select></label>
 <button id="btn">🎤 시작</button> <span id="state" class="pill">대기</span>
</div>
<div id="micinfo" style="font:12px ui-monospace,Menlo,monospace;color:#777"></div>
<div class="row">
 <label>오디오 파일 시뮬레이션 <input id="file" type="file" accept="audio/*,.wav,.flac,.mp3,.m4a,.ogg"></label>
 <label>속도 <select id="speed"><option value="1">실시간(1×)</option><option value="2">2×</option><option value="0">최대</option></select></label>
 <button id="fbtn">▶ 파일 전송</button> <span id="fstate" class="pill"></span>
</div>
<div id="text"></div>
<div id="stats"></div>
<details><summary>청크 로그</summary><div id="log"></div></details>
<script>
const $=id=>document.getElementById(id); $('delay').value='__DEFAULT_DELAY__';
let ws=null, ctx=null, node=null, stream=null, running=false, prevText='', nChunks=0, ticks=[], t0=0, audioSent=0, lastRms=0, wsState='-';
function setText(t){const el=$('text'); if(t.startsWith(prevText)){el.innerHTML=esc(prevText)+'<span class="new">'+esc(t.slice(prevText.length))+'</span>';} else el.textContent=t; prevText=t;}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function stats(){const p=q=>ticks.length?ticks.slice().sort((a,b)=>a-b)[Math.floor((ticks.length-1)*q)].toFixed(0):'-'; const el=(performance.now()-t0)/1000;
 $('stats').textContent=`WS ${wsState} · 청크 ${nChunks} · 오디오 ${(audioSent/16000).toFixed(1)} s · 입력 레벨 ${lastRms.toFixed(3)} ${lastRms<0.003?'(거의 무음!)':''} · 경과 ${el.toFixed(1)} s · 처리 지연/청크 p50 ${p(.5)} ms p90 ${p(.9)} ms max ${p(1)} ms · 밀림 ${Math.max(0,el-nChunks*0.08).toFixed(2)} s`;}
async function start(){
 ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws'); ws.binaryType='arraybuffer';
 await new Promise((res,rej)=>{ws.onopen=res; ws.onerror=rej;}); wsState='연결됨'; ws.onclose=()=>{wsState='끊김'; stats();};
 ws.onmessage=ev=>{const m=JSON.parse(ev.data);
  if(m.type==='chunk'){nChunks++; ticks.push(m.tick_ms); lastRms=m.rms||0; if(m.tokens.length||m.forced){$('log').textContent+=`k=${m.k} t=${m.t}s ${m.tick_ms}ms ${m.forced?'[forced] ':''}${JSON.stringify(m.tokens)}\n`; $('log').scrollTop=1e9;} setText(m.text); stats();}
  else if(m.type==='final'){setText(m.text); $('state').textContent=`완료 · 오디오 ${m.audio_s}s / 실시간 ${m.wall_s}s`;}
  else if(m.type==='started'){$('state').textContent=`인식 중 (${m.lang}, δ=${m.delay})`;}
  else if(m.type==='error'){$('state').textContent='오류: '+m.message; stop();}};
 ws.send(JSON.stringify({type:'start',lang:$('lang').value,delay:+$('delay').value,next_bias:+$('bias').value}));
 const dev=$('mic').value; stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:dev?{exact:dev}:undefined,channelCount:1,echoCancellation:true,noiseSuppression:false,autoGainControl:true}});
 const tr=stream.getAudioTracks()[0]; const st=tr.getSettings(); $('micinfo').textContent=`장치: ${tr.label||'?'} · muted=${tr.muted} · enabled=${tr.enabled} · ${st.sampleRate||'?'} Hz · ${st.channelCount||'?'}ch`;
 tr.onmute=()=>{$('micinfo').textContent+=' · [muted: OS/브라우저 마이크 권한 또는 다른 앱 점유]';}; await listMics();
 ctx=new AudioContext();                              // 장치 기본 샘플레이트(보통 44.1/48 kHz) 그대로 열고 워크릿에서 16 kHz 로 리샘플(강제 16 kHz 는 일부 Chrome 에서 무음)
 if(ctx.state!=='running') await ctx.resume();
 await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([`
  class P extends AudioWorkletProcessor{constructor(){super();this.buf=[];this.n=0;this.acc=0;}
   process(inp){const ch=inp[0]&&inp[0][0]; if(!ch) return true; const ratio=sampleRate/16000; // 정수/비정수 리샘플(선형)
    this.n=(this.n||0)+ch.length; let pk=0; for(let i=0;i<ch.length;i++){const a=Math.abs(ch[i]); if(a>pk) pk=a;} this.pk=Math.max(this.pk||0,pk); if(this.n>=sampleRate){this.port.postMessage({level:this.pk,rate:sampleRate}); this.n=0; this.pk=0;}
    for(let i=0;i<ch.length;i++){this.acc+=1; if(this.acc>=ratio){this.acc-=ratio; this.buf.push(ch[i]);}}
    while(this.buf.length>=1280){const f=this.buf.splice(0,1280); const o=new Int16Array(1280); for(let i=0;i<1280;i++){const v=Math.max(-1,Math.min(1,f[i])); o[i]=v<0?v*32768:v*32767;} this.port.postMessage(o.buffer,[o.buffer]);}
    return true;}}
  registerProcessor('pcm16',P);`],{type:'application/javascript'})));
 node=new AudioWorkletNode(ctx,'pcm16'); node.port.onmessage=e=>{if(e.data&&e.data.level!==undefined){$('micinfo').textContent=$('micinfo').textContent.replace(/ · 브라우저 입력 피크.*$/,'')+` · 브라우저 입력 피크 ${e.data.level.toFixed(3)} @${e.data.rate}Hz${e.data.level<0.001?' (무음 — OS 마이크 권한/장치 확인)':''}`; return;} if(ws&&ws.readyState===1){ws.send(e.data); audioSent+=1280; if(audioSent%16000===0) stats();}};
 ctx.createMediaStreamSource(stream).connect(node); node.connect(ctx.destination);
 running=true; prevText=''; $('text').textContent=''; $('log').textContent=''; nChunks=0; ticks=[]; audioSent=0; t0=performance.now(); $('btn').textContent='■ 정지'; $('btn').classList.add('on');
}
function stop(){running=false; if(node){node.disconnect();node=null;} if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;} if(ctx){ctx.close();ctx=null;}
 if(ws&&ws.readyState===1){ws.send(JSON.stringify({type:'stop'}));} $('btn').textContent='🎤 시작'; $('btn').classList.remove('on');}
async function listMics(){try{const ds=await navigator.mediaDevices.enumerateDevices(); const sel=$('mic'); const cur=sel.value; sel.innerHTML='<option value="">기본</option>'+ds.filter(d=>d.kind==='audioinput').map(d=>`<option value="${d.deviceId}">${d.label||('마이크 '+d.deviceId.slice(0,6))}</option>`).join(''); sel.value=cur;}catch(e){}}
listMics();
$('btn').onclick=()=>running?stop():start().catch(e=>{$('state').textContent='마이크/연결 실패: '+e; stop();});
// ── 오디오 파일을 80 ms 단위로 실시간 속도로 흘려 넣는 시뮬레이션(마이크 대신 같은 프로토콜)
let fileRun=false;
async function connectWS(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws'); ws.binaryType='arraybuffer';
 await new Promise((res,rej)=>{ws.onopen=res; ws.onerror=rej;}); wsState='연결됨'; ws.onclose=()=>{wsState='끊김'; stats();};
 ws.onmessage=ev=>{const m=JSON.parse(ev.data);
  if(m.type==='chunk'){nChunks++; ticks.push(m.tick_ms); lastRms=m.rms||0; if(m.tokens.length||m.forced){$('log').textContent+=`k=${m.k} t=${m.t}s ${m.tick_ms}ms ${m.forced?'[forced] ':''}${JSON.stringify(m.tokens)}\n`; $('log').scrollTop=1e9;} setText(m.text); stats();}
  else if(m.type==='final'){setText(m.text); $('state').textContent=`완료 · 오디오 ${m.audio_s}s / 실시간 ${m.wall_s}s`; $('fstate').textContent='완료'; fileRun=false; $('fbtn').textContent='▶ 파일 전송';}
  else if(m.type==='started'){$('state').textContent=`인식 중 (${m.lang}, δ=${m.delay})`;}
  else if(m.type==='error'){$('state').textContent='오류: '+m.message; fileRun=false;}};
 ws.send(JSON.stringify({type:'start',lang:$('lang').value,delay:+$('delay').value,next_bias:+$('bias').value}));}
async function decodeFile(f){const buf=await f.arrayBuffer(); const tmp=new AudioContext(); const dec=await tmp.decodeAudioData(buf); await tmp.close();
 const n=Math.ceil(dec.duration*16000); const off=new OfflineAudioContext(1,n,16000); const src=off.createBufferSource(); src.buffer=dec; src.connect(off.destination); src.start(); const out=await off.startRendering(); return out.getChannelData(0);}
async function sendFile(){const f=$('file').files[0]; if(!f){$('fstate').textContent='파일을 고르세요'; return;}
 const speed=+$('speed').value; $('fstate').textContent='디코딩…'; const pcm=await decodeFile(f); $('fstate').textContent=`${(pcm.length/16000).toFixed(1)} s 전송 중`;
 prevText=''; $('text').textContent=''; $('log').textContent=''; nChunks=0; ticks=[]; audioSent=0; t0=performance.now(); await connectWS(); fileRun=true; $('fbtn').textContent='■ 중단';
 const startT=performance.now(); let i=0;
 while(fileRun && i<pcm.length){const seg=pcm.subarray(i,i+1280); const o=new Int16Array(1280); for(let j=0;j<seg.length;j++){const v=Math.max(-1,Math.min(1,seg[j])); o[j]=v<0?v*32768:v*32767;}
  ws.send(o.buffer); audioSent+=1280; i+=1280; if(audioSent%16000===0) stats();
  if(speed>0){const due=startT+(i/16000)*1000/speed; const wait=due-performance.now(); if(wait>0) await new Promise(r=>setTimeout(r,wait));}}
 if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:'stop'}));}
$('fbtn').onclick=()=>{if(fileRun){fileRun=false; $('fbtn').textContent='▶ 파일 전송';} else sendFile().catch(e=>{$('fstate').textContent='실패: '+e; fileRun=false;});};
</script></body></html>
